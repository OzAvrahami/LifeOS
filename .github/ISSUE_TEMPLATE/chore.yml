name: Chore
description: Capture maintenance or technical work
title: "[Chore]: "
labels:
  - chore
body:
  - type: dropdown
    id: scope
    attributes:
      label: LifeOS scope
      description: Select the area most directly affected.
      options:
        - Mobile
        - API
        - Cross-cutting or not sure

  - type: textarea
    id: task
    attributes:
      label: Maintenance or technical task
      description: Describe the maintenance, tooling, dependency, refactoring, or technical-debt work.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Explain why this work is needed now or what risk it addresses.
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: Completion criteria
      description: State how completion can be verified.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Relevant technical context
      description: Add useful files, dependencies, constraints, or implementation notes.

  - type: markdown
    attributes:
      value: |
        ### Release impact
        The exact semantic version may be grouped with other issues later; no numeric version is required now.
        A mobile issue cannot complete physical acceptance on a binary that predates its implementation.
        [LifeOS Development Workflow](https://github.com/OzAvrahami/LifeOS/blob/main/docs/DEVELOPMENT_WORKFLOW.md) is authoritative.

  - type: dropdown
    id: mobile-installable-impact
    attributes:
      label: Does this affect installable mobile behavior?
      options:
        - "Yes"
        - "No"
        - "Needs review"
    validations:
      required: true

  - type: dropdown
    id: semantic-version-impact
    attributes:
      label: Expected semantic version impact
      options:
        - "None"
        - "Patch candidate"
        - "Minor candidate"
        - "Major candidate"
        - "Needs review"
    validations:
      required: true

  - type: dropdown
    id: ios-acceptance-build
    attributes:
      label: Requires new iOS acceptance build?
      options:
        - "Yes"
        - "No"
        - "Needs review"
    validations:
      required: true
