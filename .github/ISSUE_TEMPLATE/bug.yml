name: Bug
description: Report incorrect existing behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: scope
    attributes:
      label: LifeOS scope
      description: Select the area most directly affected.
      options:
        - Mobile
        - API
        - Cross-cutting or not sure

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the incorrect behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what should have happened instead.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or evidence
      description: Add screenshots, logs, or other evidence when relevant. Remove secrets and personal data first.

  - type: textarea
    id: environment
    attributes:
      label: Environment and context
      description: Note the device, operating system, build, deployment, or other relevant context.
    validations:
      required: true

  - type: textarea
    id: possible-cause
    attributes:
      label: Possible cause
      description: Optionally share a suspected cause or useful implementation lead.

  - type: markdown
    attributes:
      value: |
        ### Release impact
        The exact semantic version may be grouped with other issues later; no numeric version is required now.
        A mobile issue cannot complete physical acceptance on a binary that predates its implementation.
        [LifeOS Development Workflow](https://github.com/OzAvrahami/LifeOS/blob/main/docs/DEVELOPMENT_WORKFLOW.md) is authoritative.

  - type: dropdown
    id: mobile-installable-impact
    attributes:
      label: Does this affect installable mobile behavior?
      options:
        - "Yes"
        - "No"
        - "Needs review"
    validations:
      required: true

  - type: dropdown
    id: semantic-version-impact
    attributes:
      label: Expected semantic version impact
      options:
        - "None"
        - "Patch candidate"
        - "Minor candidate"
        - "Major candidate"
        - "Needs review"
    validations:
      required: true

  - type: dropdown
    id: ios-acceptance-build
    attributes:
      label: Requires new iOS acceptance build?
      options:
        - "Yes"
        - "No"
        - "Needs review"
    validations:
      required: true
