name: Feature
description: Propose a new capability
title: "[Feature]: "
labels:
  - feature
body:
  - type: dropdown
    id: scope
    attributes:
      label: LifeOS scope
      description: Select the area most directly affected.
      options:
        - Mobile
        - API
        - Cross-cutting or not sure

  - type: textarea
    id: motivation
    attributes:
      label: Problem or motivation
      description: Describe the user problem or opportunity this capability should address.
    validations:
      required: true

  - type: textarea
    id: capability
    attributes:
      label: Proposed capability
      description: Explain the new capability without prescribing unnecessary implementation detail.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe what should become possible or meaningfully easier.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance notes
      description: List the essential behavior or boundaries that would make the feature complete.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant examples, references, constraints, or alternatives.

  - type: markdown
    attributes:
      value: |
        ### Release impact
        The exact semantic version may be grouped with other issues later; no numeric version is required now.
        A mobile issue cannot complete physical acceptance on a binary that predates its implementation.
        [LifeOS Development Workflow](https://github.com/OzAvrahami/LifeOS/blob/main/docs/DEVELOPMENT_WORKFLOW.md) is authoritative.

  - type: dropdown
    id: mobile-installable-impact
    attributes:
      label: Does this affect installable mobile behavior?
      options:
        - "Yes"
        - "No"
        - "Needs review"
    validations:
      required: true

  - type: dropdown
    id: semantic-version-impact
    attributes:
      label: Expected semantic version impact
      options:
        - "None"
        - "Patch candidate"
        - "Minor candidate"
        - "Major candidate"
        - "Needs review"
    validations:
      required: true

  - type: dropdown
    id: ios-acceptance-build
    attributes:
      label: Requires new iOS acceptance build?
      options:
        - "Yes"
        - "No"
        - "Needs review"
    validations:
      required: true
